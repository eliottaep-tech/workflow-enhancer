<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transfer</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.5 -apple-system, Segoe UI, Inter, sans-serif;
      background: #0f1116;
      color: #e6e8ef;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #2f6df6;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 26px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { color: #9aa1b1; margin: 4px 0; }
    .status {
      margin-top: 18px;
      padding: 8px 14px;
      border-radius: 8px;
      background: #1b1e26;
      font-size: 12px;
      color: #7dd88c;
    }
  </style>
</head>
<body>
  <div class="mark">T</div>
  <h1>Transfer is running</h1>
  <p>Listening for layers from the Figma plugin.</p>
  <p>Close this window to keep Transfer running in the tray.</p>
  <div class="status">Bridge active on 127.0.0.1:7841</div>
</body>
</html>
